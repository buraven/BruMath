name: PR35 apply home layout

on:
  push:
    branches:
      - feature/home-new-layout-pr35

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'PR35 automated migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-new-layout-pr35
          fetch-depth: 0

      - name: Apply home migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('app/page.tsx')
          text = page.read_text()

          if 'import { NewHome } from "../features/home/NewHome";' not in text:
              marker = 'import { MonthSelector } from "../components/navigation/MonthSelector";'
              if marker not in text:
                  raise SystemExit('PR35: MonthSelector import marker not found')
              text = text.replace(marker, marker + '\nimport { NewHome } from "../features/home/NewHome";', 1)

          pattern = re.compile(r'(?P<indent>\s*)\{tab === "home" &&.*?(?=\n\s*\{tab === "chat")', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('PR35: home tab block not found')

          indent = match.group('indent')
          replacement = f'''{indent}{{tab === "home" && <NewHome
          profile={{activeProfile}}
          monthLabel={{monthName}}
          balance={{available}}
          income={{monthIncomeTotal}}
          expenses={{totalSpent}}
          formatMoney={{money}}
          limits={{<LimitUsageSection month={{viewMonth}} limits={{DEFAULT_CATEGORY_LIMITS}} />}}
          upcoming={{<>
            <section className="section">
              <div className="section-title"><div><h2>Assistente</h2><span className="muted">Você está falando como <strong>{{activeProfile}}</strong></span></div><span className="online"><i /> online</span></div>
              <div className="chat-preview">
                <div className="chat-profile-banner">Perfil atual: <strong>{{activeProfile}}</strong>. O perfil é usado quando a frase não informa outra pessoa.</div>
                <div className="bubble assistant-bubble">{{chat.at(-1)?.text}}</div>
                <QuickActions actions={{[{{ label: "Quanto temos?", onClick: () => send("Quanto temos?") }}, {{ label: "Insights", onClick: () => send("Me dê insights") }}, {{ label: "Resumo", onClick: () => send("Resumo") }}, {{ label: "Parcelas", onClick: () => send("Parcelas") }}, {{ label: "Quem me deve?", onClick: () => switchTab("debts") }}, {{ label: "O que entra", onClick: () => switchTab("income") }}]}} />
                <div className="input-row"><input value={{text}} onChange={{e => setText(e.target.value)}} onKeyDown={{e => {{ if (e.key === "Enter") send(); }}}} placeholder="Ex.: Matheus comprou bermuda por 70" /><button type="button" className="send-button" onClick={{() => send()}}><Send size={{17}} /><span>Enviar</span></button></div>
                <button type="button" className="open-chat" onClick={{() => switchTab("chat")}}>Abrir conversa completa <ChevronRight size={{16}} /></button>
              </div>
            </section>
            <section className="section">
              <div className="section-title"><h2>Gastos de {{monthName}}</h2><span className="muted">{{selectedMonthExpenses.length}} registros</span></div>
              <ExpenseList expenses={{selectedMonthExpenses}} onEdit={{openEditExpense}} onDelete={{deleteExpense}} formatMoney={{money}} formatDate={{shortDate}} renderIcon={{iconFor}} />
            </section>
          </>}}
        />}}'''

          text = text[:match.start()] + replacement + text[match.end():]
          page.write_text(text)

          home = Path('features/home/NewHome.tsx')
          home.write_text('''import type { ReactNode } from "react";\nimport { BalanceCard } from "./components/BalanceCard/BalanceCard";\nimport { FinancialSnapshot } from "./components/FinancialSnapshot/FinancialSnapshot";\nimport { HomeHeader } from "./components/HomeHeader/HomeHeader";\nimport { SummaryCards } from "./components/Summary/SummaryCards";\nimport { Home } from "./Home";\n\ntype NewHomeProps = {\n  profile: string;\n  monthLabel: string;\n  balance: number;\n  income: number;\n  expenses: number;\n  formatMoney: (value: number) => string;\n  limits?: ReactNode;\n  upcoming?: ReactNode;\n};\n\nexport function NewHome({ profile, monthLabel, balance, income, expenses, formatMoney, limits, upcoming }: NewHomeProps) {\n  return (\n    <Home\n      header={<HomeHeader profile={profile} monthLabel={monthLabel} />}\n      balance={<BalanceCard balance={balance} income={income} expenses={expenses} formatMoney={formatMoney} />}\n      summary={<SummaryCards income={income} expenses={expenses} formatMoney={formatMoney} />}\n      limits={limits}\n      upcoming={upcoming ?? <FinancialSnapshot balance={balance} income={income} expenses={expenses} formatMoney={formatMoney} />}\n    />\n  );\n}\n''')
          PY

      - name: Validate
        run: |
          npm ci
          npm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx features/home/NewHome.tsx .github/workflows/pr35-apply-layout.yml
          git commit -m "feat: migrate home to new layout - PR35 automated migration"
          git push origin feature/home-new-layout-pr35
